name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks CLI (not gitleaks-action@v2): the action makes GitHub API calls
      # (license-user lookup + PR-commits fetch) that hard-fail on any API
      # degradation. The CLI scans the checked-out tree with zero API calls and
      # auto-loads .gitleaks.toml (documented false-positive allowlist).
      # Version + sha256 are pinned (supply-chain hardening); the binary is
      # unpacked to RUNNER_TEMP so it is neither scanned nor tripping large-file.
      - name: Secret scan (gitleaks)
        run: |
          VER=8.24.3
          SHA=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "${SHA}  ${RUNNER_TEMP}/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --exit-code 1

      - name: Block large files (>5MB)
        run: |
          large=$(find . -type f -not -path './.git/*' -size +5M)
          if [ -n "$large" ]; then
            echo "::error::Files larger than 5MB are not allowed:"; echo "$large"; exit 1
          fi
          echo "No oversized files."

      - name: Repo hygiene
        run: |
          echo "Tracked files: $(git ls-files | wc -l)"

      # Everything below was the "add these as code lands" TODO that outlived the docs stage.
      # Until now CI only scanned for secrets and oversized files, so a change could break the
      # build or the suite and still merge green — which is exactly how a broken assertion
      # reached main. Local runs were catching it; nothing enforced them.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `check` is lint + formatter. The formatter was enforced from the reformat commit recorded
      # in .git-blame-ignore-revs; before that the tree had drifted 196 files from the config that
      # was already sitting in the repo.
      - name: Lint and format check
        run: pnpm exec biome check passion

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Test (engines + adapters)
        run: pnpm test

      # The root vitest config only globs passion/packages and passion/adapters, so every app
      # suite sat outside the gate. Apps are listed explicitly rather than swept with `pnpm -r`,
      # because each carries its own vitest config and environment (jsdom, WebGL stubs) and a
      # recursive run would silently pick up packages whose `test` script re-enters the root
      # config. Add a line when an app gains a suite.
      - name: Test (apps)
        run: |
          for app in home guide-console project-studio parent-guide concierge-app \
                     evidence-explorer evidence-explorer-themed mvp-jul24 tinker-cabin-app; do
            echo "::group::$app"
            pnpm --filter "@gt100k/$app" test
            echo "::endgroup::"
          done

      # A green suite does not mean the thing compiles: the type checker does not run Next's
      # build, and parent-guide is statically exported to AWS, so a build break ships as a
      # broken site rather than a failed test.
      - name: Build apps
        run: |
          for app in home guide-console parent-guide project-studio design-lab concierge-app \
                     evidence-explorer evidence-explorer-themed mvp-jul24 tinker-cabin-app; do
            echo "::group::$app"
            pnpm --filter "@gt100k/$app" build
            echo "::endgroup::"
          done
