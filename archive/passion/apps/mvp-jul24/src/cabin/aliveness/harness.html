<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CabinAliveness — review harness</title>
    <style>
      /* Harness chrome only. Everything that makes the room feel alive lives in CabinAliveness.css. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #080605;
        color: #f3e4cd;
        font: 13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      #root {
        position: fixed;
        inset: 0;
      }
      /* The frame is the art's own box, at its own aspect ratio: CabinAliveness positions every
         effect as a percentage of this element, so it has to match the image exactly. */
      .frame {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        height: 100vh;
        aspect-ratio: 1 / 1;
        overflow: hidden;
      }
      .frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        user-select: none;
      }
      .bar {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 14px;
        align-items: center;
        width: max-content;
        padding: 8px 14px;
        border-radius: 20px;
        background: rgba(20, 13, 9, 0.62);
        border: 1px solid rgba(240, 178, 100, 0.22);
        backdrop-filter: blur(16px);
      }
      .bar button {
        appearance: none;
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: rgba(195, 173, 147, 0.85);
      }
      .bar button[aria-pressed="true"] {
        color: #fff0d8;
        border-color: rgba(240, 178, 100, 0.45);
        background: rgba(240, 178, 100, 0.16);
      }
      .bar .label {
        font-size: 9.5px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(195, 173, 147, 0.6);
      }
      .note {
        position: fixed;
        left: 16px;
        bottom: 14px;
        z-index: 10;
        font-size: 11px;
        color: rgba(195, 173, 147, 0.65);
        text-shadow: 0 1px 6px #000;
      }
      /* A visible, unmissable badge when the OS asks for stillness — the whole point is that it is
         obvious in a screenshot which mode was captured. */
      .rm {
        color: #ffd7a8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./harness.tsx"></script>
  </body>
</html>
