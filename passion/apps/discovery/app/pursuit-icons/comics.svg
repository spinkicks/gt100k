<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#002a3a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- 4-panel grid -->
    <rect x="32" y="32" width="86" height="86" rx="12" fill="#68ba7b"/>
    <rect x="122" y="32" width="86" height="86" rx="12" fill="#6ea7ef"/>
    <rect x="32" y="122" width="86" height="86" rx="12" fill="#6ea7ef"/>
    <rect x="122" y="122" width="86" height="86" rx="12" fill="#68ba7b"/>
    <!-- speech bubble -->
    <rect x="70" y="54" width="100" height="58" rx="24" fill="#e7857d"/>
    <polygon fill="#e7857d" points="118,110 132,110 108,132"/>
  </g>
  <!-- exclamation mark -->
  <rect x="113" y="64" width="14" height="26" rx="7" fill="#002a3a"/>
  <circle cx="120" cy="100" r="8" fill="#002a3a"/>
</svg>
