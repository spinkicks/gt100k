<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#002a3a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- back leg -->
    <rect x="102" y="148" width="16" height="58" rx="8" fill="#6ea7ef" transform="rotate(12 110 148)"/>
    <!-- front leg, mid-step -->
    <rect x="122" y="148" width="16" height="58" rx="8" fill="#6ea7ef" transform="rotate(-25 130 148)"/>
    <!-- back shoe -->
    <rect x="87" y="200" width="24" height="14" rx="7" fill="#dc9150"/>
    <!-- front shoe -->
    <rect x="143" y="196" width="26" height="14" rx="7" fill="#dc9150"/>
    <!-- left arm -->
    <rect x="92" y="100" width="16" height="46" rx="8" fill="#6ea7ef" transform="rotate(-20 100 100)"/>
    <!-- right arm -->
    <rect x="132" y="100" width="16" height="46" rx="8" fill="#6ea7ef" transform="rotate(25 140 100)"/>
    <!-- torso -->
    <rect x="100" y="94" width="40" height="54" rx="16" fill="#6ea7ef"/>
    <!-- head -->
    <circle cx="120" cy="64" r="26" fill="#e7857d"/>
  </g>
  <!-- ball-joints (posable armature) -->
  <circle cx="120" cy="90" r="6" fill="#002a3a"/>
  <circle cx="100" cy="100" r="6" fill="#002a3a"/>
  <circle cx="140" cy="100" r="6" fill="#002a3a"/>
  <circle cx="110" cy="148" r="6" fill="#002a3a"/>
  <circle cx="130" cy="148" r="6" fill="#002a3a"/>
  <circle cx="116" cy="143" r="6" fill="#002a3a"/>
  <circle cx="121" cy="142" r="6" fill="#002a3a"/>
  <circle cx="98" cy="205" r="6" fill="#002a3a"/>
  <circle cx="155" cy="201" r="6" fill="#002a3a"/>
  <!-- face -->
  <circle cx="112" cy="62" r="5" fill="#002a3a"/>
  <circle cx="128" cy="62" r="5" fill="#002a3a"/>
  <path d="M 110 76 Q 120 84 130 76" fill="none" stroke="#002a3a" stroke-width="9" stroke-linecap="round"/>
  <!-- dotted motion path -->
  <circle cx="48" cy="206" r="5" fill="#002a3a"/>
  <circle cx="75" cy="196" r="6" fill="#002a3a"/>
  <circle cx="105" cy="190" r="7" fill="#002a3a"/>
</svg>
