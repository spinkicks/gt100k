<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#002a3a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- tripod left leg -->
    <path fill="#dc9150" d="M111,155 L125,155 L73,220 L47,220 Z"/>
    <!-- tripod right leg -->
    <path fill="#dc9150" d="M135,155 L149,155 L213,220 L187,220 Z"/>
    <!-- cross brace -->
    <rect x="90" y="185" width="80" height="14" rx="7" fill="#dc9150"/>
    <!-- mount head -->
    <rect x="110" y="142" width="40" height="18" rx="9" fill="#dc9150"/>
    <!-- telescope barrel, tapered, angled up-left -->
    <path fill="#6ea7ef" d="M142.8,140.4 L79,32 L31,68 L117.2,159.6 Z"/>
    <!-- eyepiece -->
    <circle cx="130" cy="150" r="15" fill="#6ea7ef"/>
    <!-- objective lens -->
    <circle cx="55" cy="50" r="26" fill="#6ea7ef"/>
    <!-- streaking asteroid -->
    <path fill="#a9ab48" d="M190,17 C202,17 210,25 208,37 C206,49 196,55 184,51 C172,47 170,33 176,23 C180,17 185,16 190,17 Z"/>
  </g>
  <!-- lens ink -->
  <circle cx="55" cy="50" r="11" fill="#002a3a"/>
  <circle cx="130" cy="150" r="6" fill="#002a3a"/>
  <!-- motion streak lines -->
  <g stroke="#002a3a" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="222" y1="8" x2="204" y2="22"/>
    <line x1="228" y1="22" x2="210" y2="34"/>
    <line x1="220" y1="38" x2="203" y2="48"/>
  </g>
</svg>
