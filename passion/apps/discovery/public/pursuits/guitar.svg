  <rect x="110" y="66" width="20" height="3" rx="1.5" fill="#002a3a"/>
  <rect x="110" y="80" width="20" height="3" rx="1.5" fill="#002a3a"/>
  <rect x="110" y="94" width="20" height="3" rx="1.5" fill="#002a3a"/>
