<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#002a3a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- paw print pad -->
    <ellipse cx="100" cy="122" rx="30" ry="24" fill="#dc9150"/>
    <!-- paw print toes -->
    <ellipse cx="64" cy="92" rx="15" ry="19" fill="#dc9150"/>
    <ellipse cx="86" cy="76" rx="14" ry="18" fill="#dc9150"/>
    <ellipse cx="114" cy="76" rx="14" ry="18" fill="#dc9150"/>
    <ellipse cx="136" cy="92" rx="15" ry="19" fill="#dc9150"/>
    <!-- magnifying glass handle -->
    <rect x="131" y="144" width="26" height="80" rx="13" fill="#6ea7ef" transform="rotate(-45 144 144)"/>
