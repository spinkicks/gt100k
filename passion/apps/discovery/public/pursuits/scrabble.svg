<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#002a3a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- tile H -->
    <rect x="34" y="48" width="78" height="78" rx="12" fill="#e7857d"/>
    <!-- tile I, shared by both words -->
    <rect x="120" y="48" width="78" height="78" rx="12" fill="#dc9150"/>
    <!-- tile T -->
    <rect x="120" y="134" width="78" height="78" rx="12" fill="#a9ab48"/>
  </g>
  <!-- letters, drawn as strokes -->
  <g stroke="#002a3a" stroke-width="9" stroke-linecap="round">
    <!-- H -->
    <line x1="54" y1="64" x2="54" y2="110"/>
    <line x1="92" y1="64" x2="92" y2="110"/>
    <line x1="54" y1="87" x2="92" y2="87"/>
    <!-- I -->
    <line x1="159" y1="64" x2="159" y2="110"/>
    <line x1="147" y1="64" x2="171" y2="64"/>
    <line x1="147" y1="110" x2="171" y2="110"/>
    <!-- T -->
    <line x1="136" y1="150" x2="182" y2="150"/>
    <line x1="159" y1="150" x2="159" y2="196"/>
  </g>
</svg>
