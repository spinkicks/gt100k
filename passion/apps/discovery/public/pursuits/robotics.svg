<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g stroke="#002a3a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- antenna -->
    <line x1="120" y1="50" x2="120" y2="34"/>
    <circle cx="120" cy="28" r="8" fill="#dc9150"/>
    <!-- arms -->
    <rect x="50" y="140" width="22" height="46" rx="11" fill="#6ea7ef"/>
    <rect x="168" y="140" width="22" height="46" rx="11" fill="#6ea7ef"/>
    <!-- legs -->
    <rect x="96" y="188" width="20" height="20" rx="8" fill="#6ea7ef"/>
    <rect x="124" y="188" width="20" height="20" rx="8" fill="#6ea7ef"/>
    <!-- body -->
    <rect x="80" y="130" width="80" height="62" rx="16" fill="#6ea7ef"/>
    <!-- head -->
    <rect x="72" y="50" width="96" height="78" rx="20" fill="#6ea7ef"/>
    <!-- face plate -->
    <rect x="88" y="66" width="64" height="46" rx="12" fill="#fcf4ef"/>
  </g>
  <!-- eyes -->
  <circle cx="105" cy="86" r="7" fill="#002a3a"/>
  <circle cx="135" cy="86" r="7" fill="#002a3a"/>
  <!-- smile -->
  <path d="M 104 100 Q 120 110 136 100" fill="none" stroke="#002a3a" stroke-width="9" stroke-linecap="round"/>
  <!-- body button -->
  <circle cx="120" cy="160" r="9" fill="#dc9150" stroke="#002a3a" stroke-width="9"/>
</svg>
