  <!-- speaker grille dots -->
  <circle cx="66" cy="126" r="5" fill="#002a3a"/>
  <circle cx="82" cy="126" r="5" fill="#002a3a"/>
  <circle cx="98" cy="126" r="5" fill="#002a3a"/>
  <circle cx="66" cy="146" r="5" fill="#002a3a"/>
  <circle cx="82" cy="146" r="5" fill="#002a3a"/>
  <circle cx="98" cy="146" r="5" fill="#002a3a"/>
  <circle cx="66" cy="166" r="5" fill="#002a3a"/>
  <circle cx="82" cy="166" r="5" fill="#002a3a"/>
  <circle cx="98" cy="166" r="5" fill="#002a3a"/>
</svg>
